[package]
name = "rkt-basicauth"
description = "A high-level basic access authentication request guard for rkt.rs"
version = "3.0.0"
readme = "README.md"
license = "MIT"
repository = "https://github.com/cocoon/rkt-basicauth"
keywords = ["web", "rkt", "auth", "basic-auth", "authentication"]
authors = ["Owez <root@ogriffiths.com>"]
edition = "2021"

[dependencies]
base64 = "0.13"
rkt = "1.2.0"
log = { version = "0.4", optional = true }

[features]
default = ["log"]
